<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="460" height="140">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3358" />
      <stop offset="50%" stop-color="#E60026" />
      <stop offset="100%" stop-color="#9E0017" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F1F5F9" />
      <stop offset="55%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Group with Shadow -->
  <g filter="url(#subtleShadow)">
    <!-- 1. MECHANICAL GEAR -->
    <path d="M 73.8 31.0 L 78.8 20.4 L 87.6 22.4 L 87.7 34.1 L 94.0 37.4 L 103.7 30.7 L 110.3 36.9 L 104.5 47.0 L 108.4 53.1 L 120.0 52.1 L 122.8 60.7 L 112.6 66.6 L 113.0 73.8 L 123.6 78.8 L 121.6 87.6 L 109.9 87.7 L 106.6 94.0 L 113.3 103.7 L 107.1 110.3 L 97.0 104.5 L 90.9 108.4 L 91.9 120.0 L 83.3 122.8 L 77.4 112.6 L 70.2 113.0 L 65.2 123.6 L 56.4 121.6 L 56.3 109.9 L 50.0 106.6 L 40.3 113.3 L 33.7 107.1 L 39.5 97.0 L 35.6 90.9 L 24.0 91.9 L 21.2 83.3 L 31.4 77.4 L 31.0 70.2 L 20.4 65.2 L 22.4 56.4 L 34.1 56.3 L 37.4 50.0 L 30.7 40.3 L 36.9 33.7 L 47.0 39.5 L 53.1 35.6 L 52.1 24.0 L 60.7 21.2 L 66.6 31.4 Z M 94.0 72.0 L 93.7 68.2 L 92.7 64.5 L 91.1 61.0 L 88.9 57.9 L 86.1 55.1 L 83.0 52.9 L 79.5 51.3 L 75.8 50.3 L 72.0 50.0 L 68.2 50.3 L 64.5 51.3 L 61.0 52.9 L 57.9 55.1 L 55.1 57.9 L 52.9 61.0 L 51.3 64.5 L 50.3 68.2 L 50.0 72.0 L 50.3 75.8 L 51.3 79.5 L 52.9 83.0 L 55.1 86.1 L 57.9 88.9 L 61.0 91.1 L 64.5 92.7 L 68.2 93.7 L 72.0 94.0 L 75.8 93.7 L 79.5 92.7 L 83.0 91.1 L 86.1 88.9 L 88.9 86.1 L 91.1 83.0 L 92.7 79.5 L 93.7 75.8 L 94.0 72.0 Z" fill="url(#gearGrad)" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="72" cy="72" r="21" fill="#0C0D10" stroke="#475569" stroke-width="2"/>
    <circle cx="72" cy="72" r="10" fill="url(#gearGrad)" opacity="0.6"/>

    <!-- 2. SPEED STREAK (WINGS OVER TOP) -->
    <path d="M 64 24 C 130 15, 215 17, 305 24 C 230 29, 155 33, 90 36 Z" fill="url(#redGrad)"/>

    <!-- 3. DYNAMIC RED K -->
    <!-- Main stem -->
    <path d="M 64 24 L 44 108 L 62 108 L 82 24 Z" fill="url(#redGrad)" stroke="#7F0015" stroke-width="1"/>
    <!-- Upper arm -->
    <path d="M 72 63 L 118 36 L 134 44 L 86 78 Z" fill="url(#redGrad)" stroke="#7F0015" stroke-width="1"/>
    <!-- Lower leg -->
    <path d="M 83 71 L 126 108 L 104 108 L 66 82 Z" fill="url(#redGrad)" stroke="#7F0015" stroke-width="1"/>

    <!-- K Inner highlights for 3D racing effect -->
    <path d="M 65 27 L 47 105 L 53 105 L 70 27 Z" fill="#FFA3B3" opacity="0.45"/>
    <path d="M 76 64 L 116 40 L 122 43 L 84 74 Z" fill="#FFA3B3" opacity="0.35"/>

    <!-- 4. WORDMARK AEN -->
    <text x="135" y="106" 
      font-family="Kanit, Changa, Outfit, sans-serif" 
      font-weight="900" 
      font-style="italic" 
      font-size="86" 
      letter-spacing="2.5" 
      fill="url(#chromeGrad)" 
      stroke="#0B0C10" 
      stroke-width="2" 
      stroke-linejoin="round">AEN</text>

    <!-- 5. RACING SUB-BANNER: AUTO MECANICA -->
    <!-- Left speed lines -->
    <line x1="108" y1="124" x2="135" y2="124" stroke="#E60026" stroke-width="3" stroke-linecap="round"/>
    <line x1="118" y1="130" x2="135" y2="130" stroke="#E60026" stroke-width="2" stroke-linecap="round"/>

    <!-- Slanted Red Plaque -->
    <path d="M 142 116 L 368 116 L 356 137 L 130 137 Z" fill="url(#redGrad)" stroke="#7F0015" stroke-width="1"/>

    <!-- Right speed lines -->
    <line x1="375" y1="124" x2="402" y2="124" stroke="#E60026" stroke-width="3" stroke-linecap="round"/>
    <line x1="375" y1="130" x2="392" y2="130" stroke="#E60026" stroke-width="2" stroke-linecap="round"/>

    <!-- Banner text -->
    <text x="249" y="131.5" 
      text-anchor="middle" 
      font-family="Kanit, Changa, Outfit, sans-serif" 
      font-weight="900" 
      font-style="italic" 
      font-size="13" 
      letter-spacing="4.5" 
      fill="#FFFFFF">AUTO MECÂNICA</text>
  </g>
</svg>